name: jclab-publish

# Publishes the jclab build to GHCR as ghcr.io/<owner>/<repo>. Tag the jclab
# branch as `v<upstream version>+jclab<n>` (e.g. v2.121.2+jclab01); `+` is not
# valid in a container tag, so the image is published as `v2.121.2-jclab01`.
on:
  push:
    tags:
      # `+` is a quantifier in GitHub's filter patterns, so the tag glob avoids
      # it; v2.121.2+jclab01 still matches.
      - 'v*jclab*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME//+/-}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=jclab-publish
          cache-to: type=gha,scope=jclab-publish,mode=max
